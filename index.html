<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eletsum - 元素共鳴消除</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0c10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #bg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
    #game-bg {
      position: absolute; top: 0; left: 0; height: 100%; width: 220%;
      background: linear-gradient(135deg, #10141d 0%, #0b0c10 50%, #1e1124 100%);
      background-size: cover; background-position: center;
      animation: panBackground 28s ease-in-out infinite alternate;
      transition: filter 0.5s;
    }
    @keyframes panBackground { 0% { transform: translateX(0%); } 100% { transform: translateX(-45%); } }

    #main-wrapper {
      position: relative; z-index: 1; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    #game-frame {
      position: relative; width: 100%; height: 100%; max-width: 440px; max-height: 920px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 35px rgba(0,0,0,0.9);
      border-left: 1px solid rgba(255,255,255,0.06); border-right: 1px solid rgba(255,255,255,0.06);
    }

    #top-hud {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(10px);
      color: #fff; font-size: 12px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .hud-bar { width: 85px; height: 8px; background: #252836; border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .hud-progress { height: 100%; width: 0%; background: #45f3ff; transition: width 0.2s; }
    .hud-timer { font-size: 15px; color: #ffeb3b; font-variant-numeric: tabular-nums; }
    .btn-icon {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
    }

    #board-wrapper { position: relative; flex: 1; width: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* 頂部操作列（危險線上方） */
    #top-action-bar {
      position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 5;
    }
    #fusion-indicator {
      font-size: 11px; font-weight: bold; color: #ff5722; background: rgba(0,0,0,0.7);
      padding: 4px 8px; border-radius: 12px; border: 1px solid #ff5722; display: none;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; transform: scale(1.03); } }

    /* 手動補球按鈕置頂 */
    #btn-manual-drop {
      background: rgba(255, 152, 0, 0.25); border: 1.5px solid #ff9800; color: #ffb74d;
      padding: 4px 10px; border-radius: 14px; font-size: 11px; font-weight: bold;
      backdrop-filter: blur(4px); cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    #btn-manual-drop:active { transform: scale(0.92); background: rgba(255, 152, 0, 0.45); }

    #danger-line {
      position: absolute; top: 48px; left: 0; width: 100%; height: 2px;
      background: repeating-linear-gradient(90deg, #ff1744, #ff1744 6px, transparent 6px, transparent 12px);
      display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
      font-size: 9px; color: #ff5252; opacity: 0.65;
    }

    /* 右側 5 角色計數器 */
    #side-trackers {
      position: absolute; right: 6px; top: 54px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 4;
    }
    .tracker-node {
      display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.65);
      padding: 2px 6px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
    }
    .tracker-dot { width: 16px; height: 16px; border-radius: 50%; }
    .tracker-val { color: #fff; font-size: 10px; font-weight: bold; min-width: 26px; }

    #bottom-dialogue-box {
      min-height: 72px; padding: 8px 12px; background: rgba(11, 12, 16, 0.9); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.15); display: flex; flex-direction: column; justify-content: center;
    }
    .dialogue-speaker { font-size: 12px; color: #45f3ff; font-weight: bold; margin-bottom: 2px; }
    .dialogue-text { font-size: 12px; color: #e0e0e0; line-height: 1.35; }

    .overlay-modal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; z-index: 20; color: #fff; text-align: center;
    }
    .modal-card {
      background: #181d26; border: 1px solid #45f3ff; border-radius: 12px;
      padding: 18px; width: 100%; max-width: 360px; max-height: 86vh; overflow-y: auto;
    }
    .btn {
      background: #45f3ff; color: #0b0c10; font-weight: bold; border: none;
      padding: 10px 24px; border-radius: 20px; font-size: 14px; margin-top: 14px; cursor: pointer;
    }
    .btn.danger { background: #ff1744; color: #fff; }
    .btn.sub { background: #333; color: #ccc; margin-right: 8px; }
    .btn:active { transform: scale(0.97); }

    #title-screen { z-index: 30; background: radial-gradient(circle at center, #1c2331 0%, #08090c 100%); }
    .title-logo { font-size: 42px; font-weight: 900; letter-spacing: 6px; color: #45f3ff; text-shadow: 0 0 20px rgba(69,243,255,0.6); margin-bottom: 6px; }
    .title-sub { font-size: 13px; color: #ff8a65; letter-spacing: 2px; margin-bottom: 28px; }

    .leader-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; max-height: 190px; overflow-y: auto; }
    .leader-item { background: #0b0c10; padding: 6px; border-radius: 8px; border: 1px solid #333; cursor: pointer; }
    .leader-item.selected { border-color: #ff5722; background: #261919; }
    .clear-badge { font-size: 9px; color: #ffeb3b; display: block; margin-top: 2px; }

    .variant-selector {
      margin: 10px 0; display: flex; gap: 6px; justify-content: center;
    }
    .variant-btn {
      font-size: 10px; padding: 4px 8px; border-radius: 12px; background: #121820; border: 1px solid #555; color: #bbb; cursor: pointer;
    }
    .variant-btn.active { border-color: #ff5722; color: #fff; background: #331a1a; font-weight: bold; }

    #banner-notify {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(90deg, transparent, rgba(255, 87, 34, 0.95), transparent);
      color: #fff; width: 100%; padding: 12px 0; text-align: center; font-size: 17px; font-weight: bold;
      letter-spacing: 2px; pointer-events: none; opacity: 0; transition: all 0.3s; z-index: 10;
    }
  </style>
</head>
<body>

<div id="bg-container"><div id="game-bg"></div></div>

<div id="main-wrapper">
  <div id="game-frame">

    <!-- 開始主畫面 -->
    <div id="title-screen" class="overlay-modal">
      <div class="title-logo">ELETSUM</div>
      <div class="title-sub">ELEMENTAL CHAIN RESONANCE</div>
      <p style="font-size: 12px; color: #aaa; max-width: 260px; line-height: 1.5; margin-bottom: 24px;">
        與獸人夥伴調和元素刻印，發動權能共鳴，突破極限盤面。
      </p>
      <button class="btn" id="btn-enter-game">進入共鳴空間</button>
    </div>

    <!-- 頂部 HUD -->
    <div id="top-hud">
      <div>
        目標: <span id="score-text">0</span> / <span id="target-score">42000</span>
        <div class="hud-bar"><div id="score-progress" class="hud-progress"></div></div>
      </div>
      <div class="hud-timer" id="timer-text">03:00</div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <span style="font-size: 11px;">連線: <b id="chain-text" style="color: #45f3ff;">0</b></span>
        <button class="btn-icon" id="btn-open-quit">放棄</button>
      </div>
    </div>

    <!-- 實體盤面 -->
    <div id="board-wrapper">
      <div id="top-action-bar">
        <div id="fusion-indicator">【融聚充能中：下一次可任意連線 10 顆】</div>
        <div style="flex: 1;"></div>
        <button id="btn-manual-drop">+ 補給落球</button>
      </div>
      <div id="danger-line">溢出警戒線</div>
      <div id="side-trackers"></div>
      <div id="banner-notify">權能發動</div>
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 底部對話 -->
    <div id="bottom-dialogue-box">
      <div id="speaker-name" class="dialogue-speaker">克爾</div>
      <div id="dialogue-content" class="dialogue-text">「速戰速決。盤面雜質太多，抓緊節奏全部融掉。」</div>
    </div>

    <!-- 隊長選擇彈窗 -->
    <div id="modal-select-leader" class="overlay-modal" style="display: none;">
      <div class="modal-card">
        <h3>選擇同行隊長</h3>
        <p style="font-size: 11px; color: #aaa; margin-top: 3px;">隊長球出現率 30%，享有專屬對話與結算圖</p>
        <div class="leader-grid" id="leader-list"></div>
        
        <div id="variant-box" style="display: none;">
          <div style="font-size: 11px; color: #ff9800; font-weight: bold;">插圖與結局挑戰分支：</div>
          <div class="variant-selector" id="variant-selector"></div>
        </div>

        <div id="leader-desc" style="font-size: 11px; color: #ddd; min-height: 44px; text-align: left; background: #121820; padding: 6px; border-radius: 6px; margin-top: 6px;"></div>
        <button class="btn" id="btn-confirm-leader">同行出發</button>
      </div>
    </div>

    <!-- 開局 5 角色提示 -->
    <div id="modal-match-brief" class="overlay-modal" style="display: none;">
      <div class="modal-card">
        <h3>本局 5 元素配置</h3>
        <p style="font-size: 11px; color: #aaa; margin: 3px 0 10px 0;">隊長出現率 30%，其餘由正向與干擾構成</p>
        <div id="brief-characters" style="display: flex; flex-direction: column; gap: 6px; text-align: left; max-height: 260px; overflow-y: auto;"></div>
        <button class="btn" id="btn-start-play">展開盤面</button>
      </div>
    </div>

    <!-- 放棄確認 -->
    <div id="modal-confirm-quit" class="overlay-modal" style="display: none;">
      <div class="modal-card" style="max-width: 280px;">
        <h3>中斷連結？</h3>
        <p style="font-size: 12px; color: #ccc; margin: 12px 0;">確定要放棄本局並返回主選單嗎？</p>
        <div>
          <button class="btn sub" id="btn-quit-cancel">繼續戰鬥</button>
          <button class="btn danger" id="btn-quit-confirm">確認返回</button>
        </div>
      </div>
    </div>

    <!-- 結算畫面 -->
    <div id="modal-result" class="overlay-modal" style="display: none;">
      <div class="modal-card">
        <h2 id="result-title">共鳴達成！</h2>
        <div id="result-cg-tag" style="font-size: 11px; color: #ffeb3b; margin: 4px 0; display: none;">【解鎖專屬結局插圖：極限融核】</div>
        <p id="result-detail" style="font-size: 12px; color: #ddd; margin: 10px 0;"></p>
        <div id="result-quote" style="font-style: italic; font-size: 12px; color: #45f3ff; margin-bottom: 12px;"></div>
        <button class="btn" id="btn-restart">回到主頁</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ================= 角色資料庫與插圖分支 ================= */
const CHARACTER_DATABASE = [
  {
    id: 'kulu', name: '克爾', element: '融元素', color: '#1a3b5c', border: '#ff3333',
    type: 'positive', reqLeader: 11, reqSupport: 16,
    desc: '【融態共鳴】生成特殊球，點擊後獲得充能：下一次消除可跨種族、無距限制任意劃選最多 10 顆！',
    cleared: true,
    variants: [
      { id: 'default', title: '常規：元素調和', targetScore: 42000, bgHue: 'normal', quote: '「幹得俐落。這場打下來節奏掌握得很好。」' },
      { id: 'overload', title: '挑戰：極限融核', targetScore: 55000, bgHue: 'overload', quote: '「……稍微融得太過火了。不過，這種程度的默契正合我意。」' }
    ]
  },
  {
    id: 'zarion', name: '澤里恩', element: '耀元素', color: '#546e7a', border: '#ffa726',
    type: 'positive', reqLeader: 13, reqSupport: 18,
    desc: '【耀斑蘊華】生成特殊球，引爆中央並轉化高分球。',
    cleared: false
  },
  {
    id: 'abyss_slug', name: '濁泥獸', element: '濁元素', color: '#2b2b2b', border: '#78909c',
    type: 'negative', reqLeader: 12, reqSupport: 13,
    desc: '【濁質沉降】消滿自動觸發，盤面重力加倍並黏滯 4 秒。',
    cleared: false
  },
  {
    id: 'disorder_wisp', name: '紊亂精怪', element: '噪元素', color: '#3a2d3c', border: '#ba68c8',
    type: 'negative', reqLeader: 13, reqSupport: 14,
    desc: '【空間紊動】消滿自動觸發，向上震盪隨機炸散相連球體。',
    cleared: false
  },
  {
    id: 'normal_fire', name: '炎犬', element: '火元素', color: '#bf360c', border: '#ff7043',
    type: 'none', reqLeader: 999, reqSupport: 999, desc: '一般火元素填充。', cleared: false
  }
];

for (let i = 5; i < 50; i++) {
  CHARACTER_DATABASE.push({
    id: `char_${i}`, name: `獸人 #${i+1}`, element: '普通',
    color: '#1f262e', border: '#546e7a', type: 'none',
    reqLeader: 999, reqSupport: 999, desc: '暫未覺醒權能的角色。', cleared: false
  });
}

/* ================= 遊戲核心狀態 ================= */
let selectedLeader = CHARACTER_DATABASE[0];
let selectedVariant = selectedLeader.variants ? selectedLeader.variants[0] : null;
let currentMatchChars = [];
let currentTrackers = {};

let currentTargetScore = 42000;
let currentScore = 0;
let gameStatus = 'TITLE';

const GAME_DURATION = 180;
let timeRemaining = GAME_DURATION;
let timerInterval = null;
let dangerTimer = 0;

// 克爾能力狀態：是否持有「下一次任意選 10 顆」的充能
let hasKuluFusionCharge = false;
const FUSION_MAX_SELECT = 10;

/* ================= Matter.js 與物理邊界 ================= */
const { Engine, World, Bodies, Body } = Matter;
const boardWrapper = document.getElementById('board-wrapper');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const fusionIndicator = document.getElementById('fusion-indicator');

let width, height;
function resizeBoard() {
  width = boardWrapper.clientWidth;
  height = boardWrapper.clientHeight;
  canvas.width = width * window.devicePixelRatio;
  canvas.height = height * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
}
window.addEventListener('resize', resizeBoard);
resizeBoard();

const engine = Engine.create({ gravity: { y: 1.5 } });
const world = engine.world;

const BALL_RADIUS = 26;
const MAX_BALLS = 45;
const balls = [];
let particles = [];
let selectedChain = [];
let isInteracting = false;

let floor, leftWall, rightWall;
function setupBoundaries() {
  const wallT = 60;
  if (floor) World.remove(world, [floor, leftWall, rightWall]);
  floor = Bodies.rectangle(width / 2, height + wallT / 2 - 4, width * 2, wallT, { isStatic: true });
  leftWall = Bodies.rectangle(-wallT / 2, height / 2, wallT, height * 2, { isStatic: true });
  rightWall = Bodies.rectangle(width + wallT / 2, height / 2, wallT, height * 2, { isStatic: true });
  World.add(world, [floor, leftWall, rightWall]);
}
setupBoundaries();

/* ================= 高畫質頭像離線快取 ================= */
const charImageCache = {};
function createHiResAvatarCache(char) {
  const offscreen = document.createElement('canvas');
  const size = 128;
  offscreen.width = size;
  offscreen.height = size;
  const oCtx = offscreen.getContext('2d');

  oCtx.save();
  oCtx.beginPath();
  oCtx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
  oCtx.clip();

  oCtx.fillStyle = char.color;
  oCtx.fillRect(0, 0, size, size);

  const grad = oCtx.createRadialGradient(size/2, size/3, 10, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,0.3)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  oCtx.fillStyle = grad;
  oCtx.fillRect(0, 0, size, size);

  oCtx.fillStyle = '#ffffff';
  oCtx.font = 'bold 36px sans-serif';
  oCtx.textAlign = 'center';
  oCtx.textBaseline = 'middle';
  oCtx.fillText(char.name.substring(0, 2), size/2, size/2);
  oCtx.restore();

  oCtx.beginPath();
  oCtx.arc(size/2, size/2, size/2 - 4, 0, Math.PI * 2);
  oCtx.lineWidth = 6;
  oCtx.strokeStyle = char.border;
  oCtx.stroke();

  return offscreen;
}
CHARACTER_DATABASE.forEach(c => { charImageCache[c.id] = createHiResAvatarCache(c); });

/* ================= 5 角色池抽取 ================= */
function setupMatchPool() {
  currentMatchChars = [];
  currentTrackers = {};

  currentMatchChars.push(selectedLeader);

  const posPool = CHARACTER_DATABASE.filter(c => c.type === 'positive' && c.id !== selectedLeader.id);
  const negPool = CHARACTER_DATABASE.filter(c => c.type === 'negative' && c.id !== selectedLeader.id);
  const fillerPool = CHARACTER_DATABASE.filter(c => c.type === 'none');

  if (selectedLeader.type === 'negative') {
    currentMatchChars.push(posPool[0], posPool[1] || posPool[0], negPool[0], fillerPool[0]);
  } else {
    currentMatchChars.push(posPool[0] || CHARACTER_DATABASE[1], negPool[0], negPool[1] || negPool[0], fillerPool[0]);
  }

  currentMatchChars.forEach(c => {
    const isLdr = (c.id === selectedLeader.id);
    const maxReq = isLdr ? c.reqLeader : c.reqSupport;
    currentTrackers[c.id] = { count: 0, max: maxReq, type: c.type };
  });

  renderTrackersUI();
}

function renderTrackersUI() {
  const sideEl = document.getElementById('side-trackers');
  sideEl.innerHTML = '';
  currentMatchChars.forEach(c => {
    if (c.type === 'none') return;
    const trk = currentTrackers[c.id];
    const node = document.createElement('div');
    node.className = 'tracker-node';
    node.id = `tracker-${c.id}`;
    node.innerHTML = `
      <div class="tracker-dot" style="background:${c.color}; border:1.5px solid ${c.border};"></div>
      <div class="tracker-val" id="trk-val-${c.id}">${trk.count}/${trk.max}</div>
    `;
    sideEl.appendChild(node);
  });
}

function updateTrackersUI(charId) {
  const valEl = document.getElementById(`trk-val-${charId}`);
  if (valEl && currentTrackers[charId]) {
    valEl.innerText = `${currentTrackers[charId].count}/${currentTrackers[charId].max}`;
  }
}

/* ================= UI 與隊長分支切換 ================= */
document.getElementById('btn-enter-game').onclick = () => {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('modal-select-leader').style.display = 'flex';
  gameStatus = 'SELECTING';
  renderLeaderSelection();
};

function renderLeaderSelection() {
  const listEl = document.getElementById('leader-list');
  listEl.innerHTML = '';

  CHARACTER_DATABASE.slice(0, 15).forEach(char => {
    const item = document.createElement('div');
    item.className = `leader-item ${char.id === selectedLeader.id ? 'selected' : ''}`;
    item.innerHTML = `
      <div style="font-weight:bold; font-size:11px; color:#fff;">${char.name}</div>
      <div style="font-size:9px; color:${char.border}">${char.element}</div>
      ${char.cleared ? '<span class="clear-badge">★ 通關</span>' : ''}
    `;
    item.onclick = () => {
      document.querySelectorAll('.leader-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      selectedLeader = char;
      refreshLeaderDetails();
    };
    listEl.appendChild(item);
  });

  refreshLeaderDetails();
}

function refreshLeaderDetails() {
  const descEl = document.getElementById('leader-desc');
  const variantBox = document.getElementById('variant-box');
  const variantSelector = document.getElementById('variant-selector');

  if (selectedLeader.variants && selectedLeader.variants.length > 0) {
    variantBox.style.display = 'block';
    variantSelector.innerHTML = '';
    selectedVariant = selectedVariant || selectedLeader.variants[0];

    selectedLeader.variants.forEach(v => {
      const vBtn = document.createElement('div');
      vBtn.className = `variant-btn ${v.id === selectedVariant.id ? 'active' : ''}`;
      vBtn.innerText = v.title;
      vBtn.onclick = () => {
        selectedVariant = v;
        document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
        vBtn.classList.add('active');
        currentTargetScore = v.targetScore;
        descEl.innerHTML = `<strong>${selectedLeader.name}・${v.title}</strong><br>目標分數：${v.targetScore}<br>${selectedLeader.desc}`;
      };
      variantSelector.appendChild(vBtn);
    });
    currentTargetScore = selectedVariant.targetScore;
    descEl.innerHTML = `<strong>${selectedLeader.name}・${selectedVariant.title}</strong><br>目標分數：${currentTargetScore}<br>${selectedLeader.desc}`;
  } else {
    variantBox.style.display = 'none';
    selectedVariant = null;
    currentTargetScore = 42000;
    descEl.innerHTML = `<strong>${selectedLeader.name} (${selectedLeader.element})</strong><br>目標分數：${currentTargetScore}<br>${selectedLeader.desc}`;
  }
}

document.getElementById('btn-confirm-leader').onclick = () => {
  document.getElementById('modal-select-leader').style.display = 'none';
  setupMatchPool();
  showMatchBrief();
};

function showMatchBrief() {
  const briefEl = document.getElementById('brief-characters');
  briefEl.innerHTML = '';
  currentMatchChars.forEach(c => {
    const isLdr = (c.id === selectedLeader.id);
    const item = document.createElement('div');
    item.style.padding = '6px';
    item.style.borderLeft = `3px solid ${c.border}`;
    item.style.background = 'rgba(0,0,0,0.35)';
    item.innerHTML = `
      <div style="font-weight:bold; font-size:11px; color:#fff;">
        ${c.name} ${isLdr ? '<span style="color:#ff5722;">[同行隊長] (出現率 30%)</span>' : ''}
      </div>
      <div style="font-size:10px; color:#aaa;">${c.desc}</div>
    `;
    briefEl.appendChild(item);
  });
  document.getElementById('target-score').innerText = currentTargetScore;
  document.getElementById('modal-match-brief').style.display = 'flex';
}

document.getElementById('btn-start-play').onclick = () => {
  document.getElementById('modal-match-brief').style.display = 'none';
  startGame();
};

document.getElementById('btn-open-quit').onclick = () => {
  if (gameStatus !== 'PLAYING') return;
  document.getElementById('modal-confirm-quit').style.display = 'flex';
};
document.getElementById('btn-quit-cancel').onclick = () => {
  document.getElementById('modal-confirm-quit').style.display = 'none';
};
document.getElementById('btn-quit-confirm').onclick = () => {
  document.getElementById('modal-confirm-quit').style.display = 'none';
  endGameSession();
  document.getElementById('title-screen').style.display = 'flex';
  gameStatus = 'TITLE';
};

/* ================= 遊戲核心與手動落球 ================= */
function startGame() {
  balls.forEach(b => World.remove(world, b));
  balls.length = 0;
  particles.length = 0;
  currentScore = 0;
  dangerTimer = 0;
  hasKuluFusionCharge = false;
  fusionIndicator.style.display = 'none';
  timeRemaining = GAME_DURATION;
  updateScore(0);
  updateTimerDisplay();

  const bg = document.getElementById('game-bg');
  if (selectedVariant && selectedVariant.bgHue === 'overload') {
    bg.style.filter = 'hue-rotate(320deg) contrast(1.2)';
  } else {
    bg.style.filter = 'none';
  }

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameStatus === 'PLAYING') {
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining <= 0) gameFail('時間耗盡，未能及時完成共鳴。');
    }
  }, 1000);

  setDialogue(selectedLeader.name, '「調和就緒。按照剛才說好的，把阻礙一口氣融開。」');
  gameStatus = 'PLAYING';
  refillBalls(MAX_BALLS);
}

function updateTimerDisplay() {
  const m = Math.floor(timeRemaining / 60);
  const s = timeRemaining % 60;
  document.getElementById('timer-text').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function getRandomWeightedChar() {
  const roll = Math.random();
  if (roll < 0.30) return currentMatchChars[0];
  if (roll < 0.52) return currentMatchChars[1];
  if (roll < 0.70) return currentMatchChars[2];
  if (roll < 0.88) return currentMatchChars[3];
  return currentMatchChars[4];
}

function spawnSingleBall(x, y, forcedChar = null, isSpecialOrb = false) {
  const char = forcedChar || getRandomWeightedChar();
  const body = Bodies.circle(x, y, BALL_RADIUS, {
    restitution: 0.12, friction: 0.05, density: 0.002
  });
  body.charData = char;
  body.isSpecialOrb = isSpecialOrb;
  balls.push(body);
  World.add(world, body);
  return body;
}

function refillBalls(targetCount) {
  const needed = targetCount - balls.length;
  for (let i = 0; i < needed; i++) {
    const rx = Math.random() * (width - 80) + 40;
    const ry = -BALL_RADIUS - (Math.random() * 220);
    spawnSingleBall(rx, ry);
  }
}

// 置頂補球按鈕
document.getElementById('btn-manual-drop').onclick = () => {
  if (gameStatus !== 'PLAYING') return;
  for (let i = 0; i < 5; i++) {
    const rx = Math.random() * (width - 80) + 40;
    const ry = -BALL_RADIUS - (i * 25);
    spawnSingleBall(rx, ry);
  }
};

setInterval(() => {
  if (gameStatus === 'PLAYING' && balls.length < MAX_BALLS) {
    refillBalls(MAX_BALLS);
  }
}, 3500);

/* ================= 觸控與連線判定 ================= */
function getPointerCoord(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handleStart(pos) {
  if (gameStatus !== 'PLAYING') return;
  isInteracting = true;
  selectedChain = [];
  checkBallUnderPointer(pos);
}

function handleMove(pos) {
  if (!isInteracting || gameStatus !== 'PLAYING') return;
  checkBallUnderPointer(pos);
}

function handleEnd() {
  if (!isInteracting) return;
  isInteracting = false;

  if (selectedChain.length >= 3) {
    executeElimination(selectedChain);
    // 若本次劃線是使用克爾的充能，結算後消耗該次機會
    if (hasKuluFusionCharge) {
      hasKuluFusionCharge = false;
      fusionIndicator.style.display = 'none';
      setDialogue('克爾', '「融聚釋放完畢。回到常規步調。」');
    }
  }
  selectedChain = [];
  document.getElementById('chain-text').innerText = '0';
}

canvas.addEventListener('mousedown', e => handleStart(getPointerCoord(e)));
window.addEventListener('mousemove', e => handleMove(getPointerCoord(e)));
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(getPointerCoord(e)); }, { passive: false });
window.addEventListener('touchmove', e => { if (isInteracting) e.preventDefault(); handleMove(getPointerCoord(e)); }, { passive: false });
window.addEventListener('touchend', handleEnd);

function checkBallUnderPointer(pos) {
  for (let b of balls) {
    const dist = Math.hypot(b.position.x - pos.x, b.position.y - pos.y);
    if (dist < BALL_RADIUS * 1.3) {
      if (b.isSpecialOrb) {
        triggerSpecialOrbSkill(b);
        return;
      }

      if (selectedChain.length === 0) {
        selectedChain.push(b);
        triggerSpark(b.position.x, b.position.y, b.charData.border);
        document.getElementById('chain-text').innerText = '1';
      } else {
        const last = selectedChain[selectedChain.length - 1];
        if (last === b) return;

        // 回退退選
        if (selectedChain.length > 1 && selectedChain[selectedChain.length - 2] === b) {
          selectedChain.pop();
          document.getElementById('chain-text').innerText = selectedChain.length;
          return;
        }

        if (selectedChain.includes(b)) return;

        // 連線規則分支：
        if (hasKuluFusionCharge) {
          // 克爾權能：打破角色限制與距離限制，任意選取最多 10 顆
          if (selectedChain.length < FUSION_MAX_SELECT) {
            selectedChain.push(b);
            triggerSpark(b.position.x, b.position.y, '#ff5722');
            document.getElementById('chain-text').innerText = `${selectedChain.length}/${FUSION_MAX_SELECT}`;
          }
        } else {
          // 常規規則：必須同角色且在相鄰距離內
          const isSame = (b.charData.id === last.charData.id);
          if (isSame) {
            const dBetween = Math.hypot(b.position.x - last.position.x, b.position.y - last.position.y);
            if (dBetween < BALL_RADIUS * 2.8) {
              selectedChain.push(b);
              triggerSpark(b.position.x, b.position.y, b.charData.border);
              document.getElementById('chain-text').innerText = selectedChain.length;
            }
          }
        }
      }
      break;
    }
  }
}

/* ================= 消除、權能與結算 ================= */
function executeElimination(chain) {
  const count = chain.length;
  let gained = 0;
  const counted = {};

  chain.forEach(b => {
    const isLdr = (b.charData.id === selectedLeader.id);
    gained += (isLdr ? 125 : 100);
    counted[b.charData.id] = (counted[b.charData.id] || 0) + 1;
    createVFX(b.position.x, b.position.y, b.charData.border);
    World.remove(world, b);
    const idx = balls.indexOf(b);
    if (idx !== -1) balls.splice(idx, 1);
  });

  gained = Math.floor(gained * (1 + (count - 3) * 0.3));
  updateScore(gained);

  for (let cid in counted) {
    if (currentTrackers[cid]) {
      currentTrackers[cid].count += counted[cid];
      if (currentTrackers[cid].count >= currentTrackers[cid].max) {
        triggerMilestone(cid);
        currentTrackers[cid].count = 0;
      }
      updateTrackersUI(cid);
    }
  }

  setTimeout(() => refillBalls(MAX_BALLS), 180);
}

function triggerMilestone(charId) {
  const char = CHARACTER_DATABASE.find(c => c.id === charId);
  if (!char) return;

  if (char.type === 'positive') {
    showBanner(`${char.name}・權能球凝縮！`);
    const rx = Math.random() * (width - 80) + 40;
    spawnSingleBall(rx, -25, char, true);
    setDialogue(char.name, '「能量已就緒，隨時引爆突破！」');
  } else if (char.type === 'negative') {
    showBanner(`警戒！${char.name}・妨害介入！`);
    if (char.id === 'abyss_slug') {
      engine.gravity.y = 3.6;
      setDialogue(selectedLeader.name, '「濁質沉降……重力暴增，撐住盤面！」');
      setTimeout(() => { engine.gravity.y = 1.5; }, 4000);
    } else {
      balls.forEach(b => {
        Body.applyForce(b, b.position, { x: (Math.random() - 0.5) * 0.05, y: -0.07 });
      });
      setDialogue(selectedLeader.name, '「盤面被震散了，重新看清楚相鄰的刻印！」');
    }
  }
}

// 點擊特殊球發動
function triggerSpecialOrbSkill(orb) {
  const char = orb.charData;
  World.remove(world, orb);
  const idx = balls.indexOf(orb);
  if (idx !== -1) balls.splice(idx, 1);

  createVFX(orb.position.x, orb.position.y, '#ffffff', 28);

  if (char.id === 'kulu') {
    // 克爾權能：啟動充能，下一次可任意連線 10 顆
    hasKuluFusionCharge = true;
    fusionIndicator.style.display = 'block';
    showBanner('【融聚充能】下一次可任意消 10 顆！');
    setDialogue('克爾', '「抓準機會。下一次直接指定 10 顆，不管是誰通通融掉！」');
  } else {
    showBanner(`${char.name}・耀斑爆發！`);
    const centerTargets = [...balls]
      .sort((a, b) => Math.hypot(a.position.x - width/2, a.position.y - height/2) - Math.hypot(b.position.x - width/2, b.position.y - height/2))
      .slice(0, 9);
    executeElimination(centerTargets);
  }
}

function updateScore(delta) {
  currentScore += delta;
  document.getElementById('score-text').innerText = currentScore;
  const pct = Math.min(100, (currentScore / currentTargetScore) * 100);
  document.getElementById('score-progress').style.width = `${pct}%`;

  if (currentScore >= currentTargetScore && gameStatus === 'PLAYING') {
    gameWin();
  }
}

function checkDangerOverflow() {
  if (gameStatus !== 'PLAYING') return;
  let overflowing = false;
  for (let b of balls) {
    if (b.position.y < 48 && b.velocity.y > -0.2 && b.velocity.y < 0.2) {
      overflowing = true;
      break;
    }
  }

  if (overflowing) {
    dangerTimer += 1 / 60;
    if (dangerTimer > 2.5) {
      gameFail('能量頂部滿溢過載，盤面崩潰。');
    }
  } else {
    dangerTimer = Math.max(0, dangerTimer - 1 / 60);
  }
}

function endGameSession() {
  gameStatus = 'ENDED';
  if (timerInterval) clearInterval(timerInterval);
}

function gameWin() {
  endGameSession();
  const resModal = document.getElementById('modal-result');
  const resCgTag = document.getElementById('result-cg-tag');
  resModal.style.display = 'flex';
  document.getElementById('result-title').innerText = '戰鬥共鳴達成！';
  document.getElementById('result-title').style.color = '#45f3ff';
  document.getElementById('result-detail').innerText = `最終分數: ${currentScore}。成功突破 ${currentTargetScore} 共鳴門檻！`;

  if (selectedVariant && selectedVariant.id === 'overload') {
    resCgTag.style.display = 'block';
    resCgTag.innerText = '【解鎖專屬高難度結局圖：極限融核】';
    document.getElementById('result-quote').innerText = selectedVariant.quote;
  } else {
    resCgTag.style.display = 'none';
    const quote = (selectedVariant && selectedVariant.quote) ? selectedVariant.quote : `「幹得俐落。這場節奏掌握得很好。」—— ${selectedLeader.name}`;
    document.getElementById('result-quote').innerText = quote;
  }
  selectedLeader.cleared = true;
}

function gameFail(reason) {
  endGameSession();
  document.getElementById('modal-result').style.display = 'flex';
  document.getElementById('result-cg-tag').style.display = 'none';
  document.getElementById('result-title').innerText = '連結中斷 (失敗)';
  document.getElementById('result-title').style.color = '#ff1744';
  document.getElementById('result-detail').innerText = reason;
  document.getElementById('result-quote').innerText = `「……嘖，被打斷了。回主頁重新調試刻印吧。」—— ${selectedLeader.name}`;
}

document.getElementById('btn-restart').onclick = () => {
  document.getElementById('modal-result').style.display = 'none';
  document.getElementById('title-screen').style.display = 'flex';
  gameStatus = 'TITLE';
};

/* ================= 畫面繪製管線 ================= */
function triggerSpark(x, y, color) {
  for (let i = 0; i < 4; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
      life: 0.7, color, size: 2.5
    });
  }
}

function createVFX(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 5 + 2;
    particles.push({
      x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
      life: 0.9, color, size: Math.random() * 3 + 2.5
    });
  }
}

function showBanner(text) {
  const banner = document.getElementById('banner-notify');
  banner.innerText = text;
  banner.style.opacity = '1';
  banner.style.transform = 'translate(-50%, -50%) scale(1)';
  setTimeout(() => {
    banner.style.opacity = '0';
    banner.style.transform = 'translate(-50%, -50%) scale(0.8)';
  }, 1100);
}

function setDialogue(speaker, text) {
  document.getElementById('speaker-name').innerText = speaker;
  document.getElementById('dialogue-content').innerText = text;
}

function mainRender() {
  Engine.update(engine, 1000 / 60);
  checkDangerOverflow();

  ctx.clearRect(0, 0, width, height);

  // 連線劃線渲染
  if (selectedChain.length > 1) {
    ctx.beginPath();
    ctx.moveTo(selectedChain[0].position.x, selectedChain[0].position.y);
    for (let i = 1; i < selectedChain.length; i++) {
      ctx.lineTo(selectedChain[i].position.x, selectedChain[i].position.y);
    }
    // 融聚充能中時連線呈現鮮亮橙紅光芒
    ctx.strokeStyle = hasKuluFusionCharge ? '#ff5722' : selectedChain[0].charData.border;
    ctx.lineWidth = 11;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // 球體
  balls.forEach(b => {
    const isSelected = selectedChain.includes(b);
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);

    const imgCache = charImageCache[b.charData.id];
    if (imgCache) {
      ctx.drawImage(imgCache, -BALL_RADIUS, -BALL_RADIUS, BALL_RADIUS * 2, BALL_RADIUS * 2);
    }

    if (isSelected) {
      ctx.beginPath();
      ctx.arc(0, 0, BALL_RADIUS + 3, 0, Math.PI * 2);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    if (b.isSpecialOrb) {
      ctx.beginPath();
      ctx.arc(0, 0, BALL_RADIUS + 4, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffd700';
      ctx.setLineDash([5, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  });

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.035;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(mainRender);
}

mainRender();
</script>
